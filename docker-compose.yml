################# Oracle Database 23ai Free
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: sunafil-oracle23ai
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: sunafil
      APP_USER_PASSWORD: sunafil
    volumes:
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

################# Volumenes
volumes:
  oradata:
